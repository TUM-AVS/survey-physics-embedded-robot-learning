name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No dependencies to install: the tooling is standard library only.
      - name: Validate the catalog
        run: python3 scripts/validate.py

      - name: Check that the generated files are up to date
        run: |
          python3 scripts/build.py
          if ! git diff --quiet -- README.md CONTRIBUTING.md exports/; then
            echo
            echo "::notice::README.md / exports are out of date for this branch."
            echo "A maintainer will regenerate them when merging - nothing for you to do."
            git --no-pager diff --stat -- README.md CONTRIBUTING.md exports/
          fi
